<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Rose</title>
<style>
:root{--bg:#000;--fg:#8a8a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:space-between;font:11px ui-monospace,Menlo,monospace;color:var(--fg)}
#txt{position:fixed;left:18px;right:18px;top:calc(env(safe-area-inset-top,0px) + 34px);font:15px/1.6 Georgia,'Times New Roman',serif;color:#f1dcdc;text-shadow:0 0 8px #000;pointer-events:none;min-height:120px}
#txt p{margin:0 0 6px}
#txt .o1{opacity:.45}#txt .o2{opacity:.22}
#pct{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);font:11px ui-monospace,Menlo,monospace;color:#d55}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="txt"></div>
<div id="pct">● 0%</div>
<div id="hud"><span>ascii rose · tap to replay</span><span id="fps">30 fps</span></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COLS=64;let W,H,ROWS,cw,ch;
function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);cw=W/COLS;ch=cw*1.8;ROWS=Math.floor(H/ch);}
addEventListener('resize',size);size();
const RAMP=" .'`,:;-~=+*xoO#%@";
const SETS=["`.,'","-_/\\.","=+vtrj","ocez>x","unaB0(","8$&@QB%"];const TAU=Math.PI*2,ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
// rose points (classic parametric rose)
const NX=46,NT=380,rose=[];
for(let i=0;i<NX;i++){const x=(i+1)/NX;for(let j=0;j<NT;j++){
 const th=20*Math.PI*j/NT,phi=Math.PI/2*Math.exp(-th/(8*Math.PI));
 const R=1-0.5*Math.pow(1.25*(1-((3.6*th)%TAU)/Math.PI)**2-0.25,2);
 const y=1.995653*x*x*Math.pow(1.27689*x-1,2)*Math.sin(phi);
 const r=R*(x*Math.sin(phi)+y*Math.cos(phi)),z=R*(x*Math.cos(phi)-y*Math.sin(phi));
 rose.push({th,x,R,phi,h:(i*7919+j*104729)&0xffff});}}
// stem + leaves
const stem=[];for(let k=0;k<200;k++){const u=k/199;stem.push({u,z:-0.9-u*5.4,off:Math.sin(u*2.2)*0.18*u});}
const leaves=[];for(const side of[-1,1]){const zb=side<0?-4.4:-3.2;
 for(let a=0;a<28;a++)for(let b=-4;b<=4;b++){const u=a/27,v=b/4,w=Math.sin(u*Math.PI)**0.8*0.85;
  leaves.push({zb,h:a*13+(b+4)*7+(side>0?5:0),side,u,x:side*(0.05+u*1.9),y:v*w*0.5,z:zb+u*1.2-u*u*0.9+v*w*0.5,v});}}
const stars=[];for(let i=0;i<110;i++)stars.push({x:Math.random(),y:Math.random(),p:Math.random()*TAU,s:0.6+Math.random()*2});
let sparks=[],T0=performance.now(),last=0;
const LOOP=32;
cv.addEventListener('click',()=>{T0=performance.now();sparks=[]});
function frame(now){
 requestAnimationFrame(frame);
 if(now-last<33)return;last=now;
 const t=((now-T0)/1000)%LOOP;
 const bloom=ease((t-6.5)/17),stemP=ease(t/5.5),leafP=0,bud=ease((t-5.2)/1.6);
 document.getElementById('pct').textContent='● '+Math.min(100,Math.round(t/24*100))+'%';
 const buf=new Float32Array(COLS*ROWS).fill(-1e9),chr=new Uint8Array(COLS*ROWS),bri=new Float32Array(COLS*ROWS),col=new Uint8Array(COLS*ROWS);
 const ang=0.55*Math.sin(t*0.45)+t*0.05,ca=Math.cos(ang),sa=Math.sin(ang),tilt=0.28+0.2*bloom,ct=Math.cos(tilt),st=Math.sin(tilt);
 const s=COLS*0.2,cx=COLS/2,cy=ROWS*0.38,sway=0.22*Math.sin(t*1.1)*ease((t-5)/3);
 const L=[-0.4,0.5,0.75];
 function put(X,Y,Z,b,c,h){ // rotate about z (spin), tilt about x, sway about y
  let a=X*ca-Y*sa,bb=X*sa+Y*ca,zz=Z;
  const dz=zz+1; a+=sway*dz*0.35;
  const y2=bb*ct-zz*st,z2=bb*st+zz*ct;
  const gx=Math.round(cx+a*s),gy=Math.round(cy-z2*s/1.8*1.0+y2*0);
  const depth=y2;
  if(gx<0||gx>=COLS||gy<0||gy>=ROWS)return;
  const k=gy*COLS+gx;if(depth<=buf[k]&&buf[k]>-1e8)return;
  buf[k]=depth;{const S=SETS[Math.max(0,Math.min(5,Math.floor(b*6)))];chr[k]=S.charCodeAt((h|0)%S.length);bri[k]=b;}col[k]=c;}
 // stem
 for(const p of stem){if(1-p.u>stemP)continue;const b=0.4+0.4*Math.sin(p.u*20+t),h=Math.floor(p.u*199)*31;put(p.off-0.08,0,p.z,b*0.7,1,h);put(p.off,0,p.z,b,1,h+7);put(p.off+0.08,0,p.z,b*0.7,1,h+13);}
 // leaves
 for(const q of leaves){if(q.u>ease((stemP-(q.zb+6.3)/5.4)*3.5))continue;const sw=1+0.05*Math.sin(t*1.4+q.side);
  const n=Math.max(0,(q.v*0.4+0.6)*(0.6+0.4*Math.sin(t*0.7+q.u*2)));put(q.x*sw,q.y,q.z,0.3+0.5*n,2,q.h);}
 // rose
 if(bud>0){const kk=0.28+0.97*bloom;
  for(const p of rose){const ph=p.phi*kk,sp=Math.sin(ph),cp=Math.cos(ph),yv=1.995653*p.x*p.x*Math.pow(1.27689*p.x-1,2)*sp,rr=p.R*(p.x*sp+yv*cp),zr=p.R*(p.x*cp-yv*sp);
   const X=rr*Math.sin(p.th)*bud,Y=rr*Math.cos(p.th)*bud,Z=zr*bud;
   const nx=X,ny=Y,nz=Z*0.9+0.2,nl=Math.hypot(nx,ny,nz)||1;
   let d=(nx*L[0]+ny*L[1]+nz*L[2])/nl;
   const b=Math.max(0.12,Math.min(1,0.08+0.5*d+0.6*Math.pow(p.x,1.2)+0.18*Math.sin(p.th*3.6)));
   put(X,Y,Z,b,0,p.h);}}
 // sparks from rose
 if(bloom>0.15&&Math.random()<0.9)for(let i=0;i<2;i++){const a=Math.random()*TAU,r=Math.random()*1.0;sparks.push({x:cx+Math.cos(a)*r*s*0.9,y:cy-0.1*s+Math.sin(a)*r*s*0.2,vx:(Math.random()-.5)*0.25,vy:-0.1-Math.random()*0.35,l:1});}
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 ctx.font=`bold ${ch*0.95}px ui-monospace,Menlo,Consolas,monospace`;ctx.textBaseline='top';ctx.textAlign='center';
 for(const st of stars){const tw=0.5+0.5*Math.sin(t*st.s*2+st.p);ctx.fillStyle=`rgba(255,255,255,${0.08+0.5*tw*tw})`;ctx.fillText('·',st.x*W,st.y*H);if(st.s>1.9&&tw>0.55){const L=5+12*tw,x=st.x*W,y=st.y*H+ch*0.45;ctx.strokeStyle=`rgba(255,255,255,${0.55*tw})`;ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(x-L,y);ctx.lineTo(x+L,y);ctx.moveTo(x,y-L);ctx.lineTo(x,y+L);ctx.stroke();}}
 const cols=['#ff3b4a','#2fd45a','#cfe6ff'];
 for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){const k=gy*COLS+gx;if(!chr[k])continue;
  const b=bri[k];ctx.globalAlpha=0.35+0.65*b;
  ctx.fillStyle=col[k]===0?(b>0.75?'#ff8a8a':b>0.4?'#e0263a':'#8c1020'):col[k]===1?(b>0.6?'#6bff8c':'#1f9e45'):'#2fd45a';
  ctx.fillText(String.fromCharCode(chr[k]),gx*cw+cw/2,gy*ch);}
 ctx.globalAlpha=1;
 sparks=sparks.filter(p=>p.l>0);
 for(const p of sparks){p.x+=p.vx*cw*0.5;p.y+=p.vy*ch*0.5;p.l-=0.012;ctx.fillStyle=`rgba(255,235,200,${Math.max(0,p.l)})`;ctx.fillText(p.l>0.5?'✦':'·',p.x,p.y);}
}
requestAnimationFrame(frame);
// letter text, typed line by line
const LINES=["Tasdid, ami jani tumi kokono firba na.","Ami j vabei chai, tumi kokonoi firba na.","Tumi jno amar life er first valobasa cila, jeta ami kokono vulte parbo na.","Ar oy somoi tai vul amari cilo.","Life e first love ar tomar onek valobasa, jeta ami nitei parini. Kotota boka ami.","Tarpor tomare nijer kore vaba, ekdom nijer family vabe neoa.","Tarpor tomar upor rag kora, jeta ami basar sobar songe kori.","But basar manus maina nito, tumi seta neo nai.","Ar somoi...","Amar na ekta somossa ace, ekdom apon manus der songe kotha bolte iccha na korar.","Ar life e eitai bul, je buler masul ditechi.","Jai hok, vlo life e agai jao.","Vlo kichu koro."];
const txt=document.getElementById('txt');let li=0,ci=0,done=[];
function draw(){const cur=LINES[li].slice(0,ci),prev=done.slice(-2);let h='';prev.forEach((l,i)=>h+='<p class="o'+(prev.length-i)+'">'+l+'</p>');txt.innerHTML=h+'<p>'+cur+'</p>';}
function step(){ci++;draw();if(ci>=LINES[li].length){setTimeout(()=>{done.push(LINES[li]);li++;ci=0;if(li>=LINES.length){setTimeout(()=>{li=0;done=[];step();},6000);return;}step();},li===LINES.length-1?500:1700);}else setTimeout(step,li===8?160:45);}
step();
</script>
</body>
</html>
